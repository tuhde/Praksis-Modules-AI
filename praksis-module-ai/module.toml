format_version = 1
api_version = 1
name = "ai"
version = "0.1.0"
module = "it.uhde.praksis.module.ai"
jdk_modules = ["java.net.http", "java.sql", "org.xerial.sqlitejdbc", "com.fasterxml.jackson.databind"]

# Asking a model. The profile (a model server and model that the person set up in praksis.toml, with
# where the text goes: this machine or not) can be limited by a grant, so that a mail may go to the
# local model and not to a cloud one. All four ask over the network, so they are 'external'. The
# answers say where the text went (data), which model, and what it cost.

[[capability]]
name = "ai.complete"
effect = "external"
dry_run = true
params = [
  { name = "prompt", type = "string", required = true, scopable = false },
  { name = "text", type = "string", required = false, scopable = false },
  { name = "system", type = "string", required = false, scopable = false },
  { name = "profile", type = "string", required = false, scopable = true },
  { name = "max_tokens", type = "int", required = false, scopable = false },
]
results = [
  { name = "text", type = "string", required = true },
  { name = "profile", type = "string", required = true },
  { name = "model", type = "string", required = true },
  { name = "data", type = "string", required = true },
  { name = "tokens_in", type = "int", required = true },
  { name = "tokens_out", type = "int", required = true },
  { name = "prompt_sha256", type = "string", required = false },
]

[[capability]]
name = "ai.classify"
effect = "external"
dry_run = true
params = [
  { name = "text", type = "string", required = true, scopable = false },
  { name = "labels", type = "list", required = true, scopable = false },
  { name = "instructions", type = "string", required = false, scopable = false },
  { name = "fallback", type = "string", required = false, scopable = false },
  { name = "profile", type = "string", required = false, scopable = true },
]
results = [
  { name = "label", type = "string", required = true },
  { name = "matched", type = "bool", required = true },
  { name = "profile", type = "string", required = true },
  { name = "model", type = "string", required = true },
  { name = "data", type = "string", required = true },
  { name = "tokens_in", type = "int", required = true },
  { name = "tokens_out", type = "int", required = true },
  { name = "prompt_sha256", type = "string", required = false },
]

[[capability]]
name = "ai.extract"
effect = "external"
dry_run = true
params = [
  { name = "text", type = "string", required = true, scopable = false },
  { name = "fields", type = "list", required = true, scopable = false },
  { name = "instructions", type = "string", required = false, scopable = false },
  { name = "profile", type = "string", required = false, scopable = true },
]
results = [
  { name = "values", type = "map", required = true },
  { name = "found", type = "int", required = true },
  { name = "profile", type = "string", required = true },
  { name = "model", type = "string", required = true },
  { name = "data", type = "string", required = true },
  { name = "tokens_in", type = "int", required = true },
  { name = "tokens_out", type = "int", required = true },
  { name = "prompt_sha256", type = "string", required = false },
]

[[capability]]
name = "ai.embed"
effect = "external"
dry_run = true
params = [
  { name = "text", type = "string", required = true, scopable = false },
  { name = "profile", type = "string", required = false, scopable = true },
]
results = [
  { name = "vector", type = "list", required = true },
  { name = "dimensions", type = "int", required = true },
  { name = "profile", type = "string", required = true },
  { name = "model", type = "string", required = true },
  { name = "data", type = "string", required = true },
  { name = "tokens_in", type = "int", required = true },
  { name = "tokens_out", type = "int", required = true },
]

# How good a profile is at a classification, on examples with known answers: the share that got
# the label they were given, and the ones that did not. Every example is a call of ai.classify, so
# it counts against the budget and is logged.
[[capability]]
name = "ai.evaluate"
effect = "external"
dry_run = true
params = [
  { name = "examples", type = "list", required = true, scopable = false },
  { name = "labels", type = "list", required = true, scopable = false },
  { name = "instructions", type = "string", required = false, scopable = false },
  { name = "profile", type = "string", required = false, scopable = true },
]
results = [
  { name = "accuracy", type = "double", required = true },
  { name = "correct", type = "int", required = true },
  { name = "total", type = "int", required = true },
  { name = "off_list", type = "int", required = true },
  { name = "complete", type = "bool", required = true },
  { name = "misses", type = "list", required = true },
  { name = "profile", type = "string", required = true },
  { name = "model", type = "string", required = true },
  { name = "data", type = "string", required = true },
  { name = "tokens_in", type = "int", required = true },
  { name = "tokens_out", type = "int", required = true },
]

# The log of the calls. What was sent and what came back is in it only with content = true.
[[capability]]
name = "ai.calls"
effect = "read-only"
dry_run = true
params = [
  { name = "limit", type = "int", required = false, scopable = false },
  { name = "profile", type = "string", required = false, scopable = true },
  { name = "content", type = "bool", required = false, scopable = false },
]
results = [{ name = "items", type = "list", required = true }]

# Sends a logged ai.complete call again, exactly as it was, to the same or another profile, and says
# whether the answer is the same. It needs content in the log (log_content = true).
[[capability]]
name = "ai.replay"
effect = "external"
dry_run = true
params = [
  { name = "id", type = "int", required = true, scopable = false },
  { name = "profile", type = "string", required = false, scopable = true },
]
results = [
  { name = "again", type = "string", required = true },
  { name = "original", type = "string", required = true },
  { name = "same", type = "bool", required = true },
  { name = "original_model", type = "string", required = true },
  { name = "profile", type = "string", required = true },
  { name = "model", type = "string", required = true },
  { name = "data", type = "string", required = true },
  { name = "tokens_in", type = "int", required = true },
  { name = "tokens_out", type = "int", required = true },
  { name = "prompt_sha256", type = "string", required = false },
]
